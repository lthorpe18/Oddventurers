<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4ead7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oddventurers">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=7">
<title>Oddventurers — Prototype v0.5</title>
</head>
<body>
<div id="app"></div>
<script>
(async function(){
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}
  const script=document.createElement('script');
  script.src='app-v3.js?v=7';
  script.onload=function(){document.documentElement.dataset.gameLoaded='1';};
  script.onerror=function(){document.getElementById('app').innerHTML='<div class="shell"><div class="card"><h1>Oddventurers</h1><p>The game script could not load.</p><button class="btn good" onclick="location.reload()">Try again</button></div></div>';};
  document.body.appendChild(script);
})();
setTimeout(function(){
  const app=document.getElementById('app');
  if(app && !app.innerHTML.trim()) app.innerHTML='<div class="shell"><div class="card"><h1>Oddventurers</h1><p>The browser may still be using an old cached build.</p><p>Please clear website data for <b>lthorpe18.github.io</b> once, then reload.</p></div></div>';
},3000);
</script>
</body>
</html>
