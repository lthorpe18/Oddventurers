<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4ead7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oddventurers">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=5">
<title>Oddventurers — Prototype</title>
</head>
<body>
<div id="app"></div>
<script>
(async function(){
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}
  const s = document.createElement('script');
  s.src = 'app-v3.js?v=5';
  s.onload = function(){ document.documentElement.dataset.gameLoaded = '1'; };
  s.onerror = function(){
    document.getElementById('app').innerHTML = '<div class="shell"><div class="card"><h1>Oddventurers</h1><p>The game script could not load.</p><button class="btn good" onclick="location.reload()">Try again</button></div></div>';
  };
  document.body.appendChild(s);
})();
setTimeout(function(){
  var app=document.getElementById('app');
  if(app && !app.innerHTML.trim()){
    app.innerHTML='<div class="shell"><div class="card"><h1>Oddventurers</h1><p>The browser is still using an old cached build.</p><p>Please clear website data for <b>lthorpe18.github.io</b> once, then reload.</p></div></div>';
  }
},2500);
</script>
</body>
</html>
