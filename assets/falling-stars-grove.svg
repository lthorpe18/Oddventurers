<path d="M960 245q45-28 88 0" stroke="#30352f" stroke-width="11" fill="none"/><path d="M1080 235q45-22 82 10" stroke="#30352f" stroke-width="11" fill="none"/><circle cx="1020" cy="255" r="11" fill="#d9e0cd"/>
