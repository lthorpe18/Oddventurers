<g fill="#fff4a8"><path d="M470 215l12 30 31 3-24 20 8 31-27-17-27 17 8-31-24-20 31-3z"/><path d="M705 180l9 22 23 2-18 15 6 23-20-12-19 12 6-23-18-15 23-2z"/></g>
