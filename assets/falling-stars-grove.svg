<g fill="#81593a" stroke="#513623" stroke-width="5"><rect x="520" y="535" width="86" height="42"/><rect x="620" y="520" width="86" height="42"/><rect x="720" y="510" width="86" height="42" transform="rotate(10 763 531)"/><rect x="820" y="520" width="86" height="42" transform="rotate(-12 863 541)"/><rect x="930" y="540" width="86" height="42"/></g>
