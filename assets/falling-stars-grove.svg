<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Falling Stars Grove, a magical woodland emergency with star-fire, a waking stone giant and a trapped star sprite">
<defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2d2458"/><stop offset=".55" stop-color="#495b88"/><stop offset="1" stop-color="#172b32"/></linearGradient><linearGradient id="rift" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff73d0"/><stop offset=".5" stop-color="#8b70ff"/><stop offset="1" stop-color="#43d9ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="900" fill="url(#night)"/>
<g fill="#142f2e"><path d="M0 180Q120 30 240 170T480 150T720 165T960 135T1200 160T1440 130T1680 150V420H0Z"/></g>
<!-- trees -->
<g stroke="#4e3428" stroke-width="36" fill="none"><path d="M120 900Q70 550 150 120"/><path d="M1450 900Q1510 580 1430 120"/><path d="M1260 900Q1310 610 1270 250"/></g>
<g fill="#244f3a"><circle cx="120" cy="125" r="150"/><circle cx="1435" cy="145" r="170"/><circle cx="1260" cy="220" r="125"/></g>
