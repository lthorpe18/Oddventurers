<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Stormbreak Bazaar, a floating market being torn apart by a magical storm">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#243a72"/><stop offset=".55" stop-color="#6fa6d8"/><stop offset="1" stop-color="#e8f1df"/></linearGradient>
 <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5f564a"/><stop offset="1" stop-color="#26252d"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-opacity=".28"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<g fill="none" stroke="#e8f5ff" stroke-width="12" opacity=".75"><path d="M210 80l60 90-45 28 90 105"/><path d="M1130 62l-55 98 52 19-73 109"/></g>
<g fill="#f4f1df" opacity=".45"><ellipse cx="460" cy="350" rx="250" ry="90"/><ellipse cx="1000" cy="300" rx="310" ry="95"/></g>
<!-- left floating island -->
<g filter="url(#shadow)">
 <path d="M0 475L420 430 520 500 440 575 330 690 190 795 80 700Z" fill="url(#rock)"/>
 <path d="M0 420L430 390 500 455 398 500 180 518 0 500Z" fill="#75975e"/>
 <g fill="#b96d4f" stroke="#5c382d" stroke-width="8"><path d="M42 345h305v140H42z"/><path d="M66 300h258l46 66H24z"/></g>
 <g stroke="#634534" stroke-width="12"><path d="M380 440V275"/><path d="M52 432V290"/></g>
 <g fill="#f0d17a"><path d="M15 280h380v32H15z"/><path d="M50 385h240v25H50z"/></g>
 <text x="95" y="370" font-family="system-ui,sans-serif" font-size="42" font-weight="900" fill="#412f29">WINDWARD WARES</text>
</g>
<!-- right floating island -->
<g filter="url(#shadow)">
 <path d="M1110 470l490-80v420h-360l-150-210z" fill="url(#rock)"/>
 <path d="M1050 420l550-95v185l-430 85-120-70z" fill="#6d9c5b"/>
 <rect x="1210" y="330" width="310" height="210" rx="12" fill="#bf7652" stroke="#56382e" stroke-width="9"/>
 <path d="M1170 335h390l-30-75h-330z" fill="#7e4b88" stroke="#4d3154" stroke-width="10"/>
 <text x="1260" y="430" font-family="system-ui,sans-serif" font-size="38" font-weight="900" fill="#fff4cf">SKYMARKET</text>
 <!-- panicked merchant -->
 <circle cx="1150" cy="420" r="38" fill="#da8cae"/><path d="M1118 390l-28-55 54 31 25-45 17 58z" fill="#853d70"/><circle cx="1138" cy="415" r="7"/><circle cx="1163" cy="409" r="7"/><path d="M1136 439q26 18 42-4" fill="none" stroke="#4f2d3d" stroke-width="8"/>
</g>
<!-- bridge being blown apart -->
<g stroke="#5d3e2d" stroke-width="11" fill="#9b6943"><path d="M430 470Q790 390 1120 455" fill="none"/><path d="M430 500Q790 425 1115 490" fill="none"/></g>
<g fill="#9a6a48" stroke="#5b3d2c" stroke-width="5"><rect x="520" y="440" width="80" height="40" rx="6"/><rect x="615" y="425" width="80" height="40" rx="6"/><rect x="715" y="414" width="80" height="40" rx="6" transform="rotate(8 755 434)"/><rect x="820" y="420" width="80" height="40" rx="6" transform="rotate(-13 860 440)"/><rect x="930" y="430" width="80" height="40" rx="6" transform="rotate(19 970 450)"/></g>
<!-- balloon drifting -->
<g filter="url(#shadow)"><ellipse cx="1200" cy="155" rx="155" ry="130" fill="#d96645" stroke="#743a32" stroke-width="10"/><path d="M1080 96q120 75 240 0M1085 200q115-70 230 0M1200 25v260" fill="none" stroke="#f2c46b" stroke-width="20"/><path d="M1145 275l35 90h75l34-90" fill="none" stroke="#6b4b39" stroke-width="9"/><rect x="1170" y="345" width="100" height="78" rx="12" fill="#8d5b38" stroke="#4c3428" stroke-width="9"/></g>
<!-- swinging crate -->
<g filter="url(#shadow)"><path d="M795 170q20 185 4 370" fill="none" stroke="#4f3b31" stroke-width="12"/><rect x="715" y="530" width="160" height="135" rx="10" fill="#9b653d" stroke="#4b3328" stroke-width="10" transform="rotate(-10 795 598)"/><path d="M735 545l120 100M850 545L735 650" stroke="#5f402d" stroke-width="9"/></g>
<!-- wind streaks -->
<g fill="none" stroke="#eaf6ff" stroke-width="8" opacity=".7"><path d="M70 155q240-80 440 0t450 0"/><path d="M250 660q300-100 560 0t540-30"/><path d="M880 230q210-90 430 0"/></g>
<!-- flying debris -->
<g fill="#e6c65f"><path d="M610 215l33-20 20 32-43 16z"/><path d="M1025 550l45-25 12 41-44 11z"/><path d="M1340 620l35-28 24 34-43 19z"/></g>
</svg>