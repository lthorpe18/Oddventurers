<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="The Upside-Down Banquet, a magical hall where gravity is failing">
<defs><linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a2d68"/><stop offset="1" stop-color="#261a45"/></linearGradient><linearGradient id="fire" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#6244ff"/><stop offset=".5" stop-color="#54d9ff"/><stop offset="1" stop-color="#e7f5ff"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".32"/></filter></defs>
<rect width="1600" height="900" fill="url(#wall)"/>
<!-- floor / ceiling beams -->
<path d="M0 750h1600v150H0z" fill="#422c2a"/><g stroke="#241818" stroke-width="22"><path d="M0 790h1600"/><path d="M0 90h1600"/><path d="M220 0v175M650 0v175M1080 0v175M1460 0v175"/></g>
<!-- tall windows -->
<g fill="#7cc8e8" stroke="#2b2240" stroke-width="14"><path d="M85 225q90-120 180 0v250H85z"/><path d="M1320 180q90-120 180 0v265h-180z"/></g>
<g fill="#d9f4ff" opacity=".55"><circle cx="170" cy="290" r="42"/><circle cx="1390" cy="270" r="48"/></g>
<!-- upside-down table floating -->
<g transform="translate(650 400) rotate(-8)" filter="url(#sh)"><ellipse cx="0" cy="0" rx="280" ry="90" fill="#f4efe3" stroke="#8c6757" stroke-width="9"/><path d="M-250 0v170M250 0v170" stroke="#7f5845" stroke-width="24"/><g fill="#d6a343"><ellipse cx="-110" cy="-20" rx="48" ry="32"/><ellipse cx="20" cy="-30" rx="60" ry="38"/><ellipse cx="135" cy="-10" rx="45" ry="28"/></g><g fill="#fff8e8" stroke="#8d7d72" stroke-width="5"><circle cx="-180" cy="25" r="34"/><circle cx="75" cy="30" r="32"/></g></g>
<!-- tilted chandelier -->
<g transform="translate(760 135) rotate(18)" stroke="#60492d" stroke-width="12" fill="none" filter="url(#sh)"><path d="M0-120V0"/><ellipse cx="0" cy="35" rx="155" ry="70"/><path d="M-120 30v-75M-60 10v-85M0 0v-90M60 10v-85M120 30v-75"/></g>
<g fill="#ffd86b"><circle cx="640" cy="135" r="16"/><circle cx="700" cy="110" r="16"/><circle cx="760" cy="100" r="16"/><circle cx="820" cy="115" r="16"/><circle cx="880" cy="145" r="16"/></g>
<!-- cat on curtain -->
<path d="M250 100q90 135 35 335" stroke="#2f7c5a" stroke-width="80" fill="none"/><g transform="translate(275 320) rotate(-12)"><circle cx="0" cy="0" r="43" fill="#6d7182"/><path d="M-32-28l-15-40 36 25M30-28l20-38-2 43" fill="#6d7182"/><circle cx="-13" cy="-4" r="7" fill="#f1e77d"/><circle cx="14" cy="-4" r="7" fill="#f1e77d"/><path d="M0 15q17 11 30-1" stroke="#332937" stroke-width="6" fill="none"/><path d="M-30 28q-40 55-5 100" stroke="#6d7182" stroke-width="25" fill="none"/></g>
<!-- floating chairs -->
<g fill="#8d5f4a" stroke="#523829" stroke-width="9" filter="url(#sh)"><path d="M405 465h85v110h-85zM395 575h105v28H395z" transform="rotate(28 447 535)"/><path d="M1040 250h85v110h-85zM1030 360h105v28h-105z" transform="rotate(-33 1082 320)"/><path d="M1180 560h85v110h-85zM1170 670h105v28h-105z" transform="rotate(18 1222 630)"/></g>
<!-- floating teacups -->
<g fill="#fff7e8" stroke="#8f7e71" stroke-width="5"><g transform="translate(520 235) rotate(20)"><ellipse cx="0" cy="0" rx="35" ry="20"/><path d="M30 0q35 0 18 27" fill="none"/></g><g transform="translate(970 480) rotate(-30)"><ellipse cx="0" cy="0" rx="36" ry="20"/><path d="M31 0q36 0 18 27" fill="none"/></g><g transform="translate(1220 220) rotate(12)"><ellipse cx="0" cy="0" rx="33" ry="19"/><path d="M29 0q32 0 17 24" fill="none"/></g></g>
<!-- blue magic fireplace -->
<g transform="translate(1160 600)"><path d="M0 140V25q0-35 35-35h210q35 0 35 35v115" fill="#674239" stroke="#352522" stroke-width="14"/><rect x="40" y="65" width="200" height="85" rx="8" fill="#221c2a"/><path d="M85 145q-30-90 25-120q5 65 40 35q10-80 55-105q-20 95 22 120q35 30-5 70z" fill="url(#fire)"/></g>
<!-- airborne diners -->
<g filter="url(#sh)"><g transform="translate(910 330) rotate(15)"><circle r="30" fill="#f2bf8e"/><path d="M-28 30h58l40 90h-135z" fill="#4b99c8"/><path d="M-14-4h8M10-4h8" stroke="#382a2c" stroke-width="6"/></g><g transform="translate(560 620) rotate(-28)"><circle r="31" fill="#d7a374"/><path d="M-30 30h60l45 90h-145z" fill="#6d8f4f"/><path d="M-15-4h8M10-4h8" stroke="#382a2c" stroke-width="6"/></g></g>
<!-- ceiling door -->
<g transform="translate(720 12)"><rect x="0" y="0" width="170" height="110" rx="10" fill="#7d4e39" stroke="#3c2b25" stroke-width="10"/><circle cx="140" cy="55" r="9" fill="#e6c65b"/></g>
<!-- magical gravity swirls -->
<g fill="none" stroke="#bba7ff" stroke-width="8" opacity=".55"><path d="M180 580q180-110 350 15t350-5"/><path d="M750 720q200-130 420 5t350-30"/><path d="M430 160q120 90 240 25"/></g>
</svg>