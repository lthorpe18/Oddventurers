<text x="835" y="220" font-size="24" fill="#7550a0">EXTRA</text><text x="835" y="265" font-size="32" fill="#4e3768">Magic</text><text x="835" y="302" font-size="32" fill="#4e3768">Handbag</text><text x="835" y="360" font-size="18" fill="#7f7390">ABILITY</text><text x="835" y="395" font-size="27" fill="#6b4098">Just the Thing!</text></g>
