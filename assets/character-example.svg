<text x="115" y="350" font-size="24" fill="#3e80ae">BODY</text><text x="115" y="387" font-size="38" fill="#2b536c">Jelly Body</text><text x="115" y="440" font-size="19" fill="#647985">ABILITY</text><text x="115" y="480" font-size="32" fill="#2f7e9f">Squish &amp; Squeeze</text>
