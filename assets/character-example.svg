<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-label="Example Oddventurer made from Dragon Head, Jelly Body, Spider Legs and Magic Handbag cards">
<defs><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".2"/></filter><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9e9"/><stop offset="1" stop-color="#f0e4c9"/></linearGradient><linearGradient id="jelly" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68d9d2"/><stop offset="1" stop-color="#4b8fd2"/></linearGradient></defs>
<rect width="1100" height="900" rx="45" fill="#f7f1e5"/>
<!-- connecting cards -->
<g filter="url(#sh)">
 <rect x="80" y="70" width="700" height="230" rx="28" fill="url(#paper)"/>
 <rect x="80" y="302" width="700" height="245" rx="28" fill="url(#paper)"/>
 <rect x="80" y="549" width="700" height="260" rx="28" fill="url(#paper)"/>
 <rect x="805" y="170" width="220" height="530" rx="28" fill="#f1e4fa"/>
</g>
<!-- subtle seams -->
<g stroke="#d4b7ff" stroke-width="8" opacity=".7"><path d="M390 299h360"/><path d="M390 548h360"/></g><g fill="#fff" opacity=".8"><circle cx="470" cy="299" r="7"/><circle cx="560" cy="299" r="5"/><circle cx="650" cy="299" r="7"/><circle cx="470" cy="548" r="6"/><circle cx="560" cy="548" r="8"/><circle cx="650" cy="548" r="5"/></g>
